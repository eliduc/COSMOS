<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Доступ не разрешён</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<!-- Standalone page: no app.js, self-contained styles. Served to users who
     passed Cloudflare Access (email OTP) but are absent from the app's own
     user catalog, or whose account is disabled. -->
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    color: #1c2430;
    background: #f5f6f8;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: #ffffff;
    border: 1px solid #d9dee5;
    border-radius: 8px;
    padding: 24px;
  }
  h1 { font-size: 19px; margin: 0 0 12px; }
  p { margin: 0 0 10px; }
  .muted { color: #67717e; }
  .mono {
    font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas,
                 "Liberation Mono", Menlo, monospace;
    font-weight: 600;
    overflow-wrap: anywhere;
  }
  a { color: #1565c0; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px">
    <img src="/logo.svg" alt="" style="width:32px; height:32px">
    <h1 style="margin:0">Доступ не разрешён</h1>
  </div>
  <p>Этот адрес электронной почты не уполномочен. Обратитесь к администратору.</p>
  <p id="email-line" class="muted hidden">Вы вошли как:
    <span id="email" class="mono"></span></p>
  <p><a href="/cdn-cgi/access/logout">Выйти и войти под другим адресом</a></p>
</div>
<script>
"use strict";
// Show the signed-in email if the server passed it as ?email=...
// textContent only: the query parameter is untrusted input.
(function () {
  var email = new URLSearchParams(window.location.search).get("email");
  if (email) {
    document.getElementById("email").textContent = email;
    document.getElementById("email-line").classList.remove("hidden");
  }
})();
</script>
</body>
</html>

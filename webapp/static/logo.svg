<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="COSMOS">
  <title>COSMOS</title>
  <!-- «Орбитальная C»: буква C как незамкнутая орбита; спутник-борт (золотая
       точка) замыкает её, оставляя затухающий след из рейсов. Палитра
       приложения: акцент #1565c0, тёплая звезда #d97706. -->
  <path d="M 49.4 17.5 A 27 27 0 1 0 49.4 46.5"
        fill="none" stroke="#1565c0" stroke-width="5.6" stroke-linecap="round"/>
  <!-- затухающий след -->
  <circle cx="55.2" cy="24.6" r="2.4" fill="#1565c0" opacity="0.55"/>
  <circle cx="58.0" cy="31.6" r="1.7" fill="#1565c0" opacity="0.35"/>
  <circle cx="58.6" cy="38.6" r="1.15" fill="#1565c0" opacity="0.18"/>
  <!-- спутник-борт, замыкающий орбиту -->
  <circle cx="49.4" cy="17.5" r="4.4" fill="#d97706"/>
  <circle cx="49.4" cy="17.5" r="6.8" fill="none" stroke="#d97706"
          stroke-width="1.1" opacity="0.45"/>
</svg>

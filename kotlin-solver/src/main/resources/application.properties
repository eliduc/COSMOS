########################
# Timefold Solver properties (Kotlin variant — twin of java-solver, port 9091)
########################

# Named solver "crew" (main domain). With two @PlanningSolution classes on
# the classpath the Quarkus extension requires ALL solvers to be named via
# @Named injection points + per-name solver-config-xml.
quarkus.timefold.solver.crew.solver-config-xml=solverConfig.xml
quarkus.timefold.solver.crew.termination.spent-limit=120s
# Deterministic Local Search trajectory.
quarkus.timefold.solver.crew.random-seed=0
quarkus.log.category."ai.timefold.solver".level=INFO
# Quarkus Timefold's default is PHASE_ASSERT (debug mode that runs
# expensive assertions at the end of each phase — 100-1000× slower
# than REPRODUCIBLE on big problems). We're past the domain-bug-hunting
# stage; switch to REPRODUCIBLE for production-grade throughput while
# keeping deterministic trajectories. Confirmed empirically on BTS
# 6-island run: PHASE_ASSERT made CH spend 84 min on a 150s budget.

# Run on a separate port from Java solver (9090) and Python FastAPI (8765).
# 9091 is outside Windows Hyper-V's 8030-8129 reserved range.
quarkus.http.port=9091
quarkus.http.host=127.0.0.1

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://127.0.0.1:8765,http://localhost:8765

quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/q/openapi

# Named solver for the Timefold-on-SPP thesis experiment (spp/SppResource.kt).
quarkus.timefold.solver.spp.solver-config-xml=sppSolverConfig.xml
# Named solver for the GERAD rules profile (benchmark 1).
quarkus.timefold.solver.gerad.solver-config-xml=geradSolverConfig.xml
# Environment mode for the crew solver (fast, deterministic — see gotcha #4).
quarkus.timefold.solver.crew.environment-mode=no-assert

# Named solver for the GERAD phase-2 personalization profile (rules=GERAD2).
quarkus.timefold.solver.gerad2.solver-config-xml=geradPhase2SolverConfig.xml

# Named solver for the GERAD stage-2 pairing-roster profile (rules=GERAD2P).
quarkus.timefold.solver.gerad2p.solver-config-xml=geradPairingRosterSolverConfig.xml

# Named solver for the GERAD phase-3 integrated-objective profile (rules=GERAD3).
quarkus.timefold.solver.gerad3.solver-config-xml=geradPhase3SolverConfig.xml
